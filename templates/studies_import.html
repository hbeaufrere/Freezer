{% extends "base.html" %}
{% block title %}Importing a CBC &middot; Research projects{% endblock %}

{% block content %}
<div class="page-head">
    <div>
        <h1 class="page-title"><i class="bi bi-box-arrow-in-down text-body-secondary"></i>Importing a CBC</h1>
        <div class="page-sub" id="import-status">Waiting for VMACS&hellip;</div>
    </div>
</div>
<div class="study-cards is-page" id="import-choices"></div>
{% endblock %}

{% block scripts %}
<script>
    /* The landing page for the VMACS importer. The userscript hands over the
       report rows; this works out which study they belong to and passes the
       parsed CBC on to that study's page for checking. */
    (function () {
        const status = document.getElementById('import-status');
        let handled = false;

        async function handle(payload) {
            if (handled) return;
            handled = true;
            status.textContent = 'Reading the CBC…';
            try {
                const parsed = await API.post('/api/studies/parse', {
                    kind: 'vmacs', header: payload.header, rows: payload.rows, study: payload.study || '',
                });
                parsed.wrmd_number = payload.wrmd || '';
                const go = (slug) => {
                    sessionStorage.setItem('ri-pending-import', JSON.stringify(parsed));
                    window.location.href = '/studies/' + encodeURIComponent(slug);
                };
                if (parsed.study_slug) { go(parsed.study_slug); return; }
                status.textContent = `This is a ${parsed.breed || parsed.species || 'bird'} — which study is it for?`;
                const studies = await API.get('/api/studies');
                const host = document.getElementById('import-choices');
                host.innerHTML = studies.map((s) => `
                    <button type="button" class="study-card" data-slug="${escapeHtml(s.slug)}">
                        <span class="study-card-name">${escapeHtml(s.name)}</span>
                        <span class="study-card-sub">${escapeHtml(s.species_name || '')}</span>
                    </button>`).join('');
                host.querySelectorAll('[data-slug]').forEach((b) => b.addEventListener('click', () => go(b.dataset.slug)));
            } catch (err) {
                status.textContent = err.message;
            }
        }

        window.addEventListener('message', (event) => {
            if (event.origin !== window.location.origin || !event.data) return;
            if (event.data.type === 'ri-import-payload') handle(event.data.payload);
        });
        window.postMessage({ type: 'ri-import-page-ready' }, window.location.origin);
        setTimeout(() => {
            if (!handled) {
                status.innerHTML = 'Nothing arrived from VMACS. Open the case there and press '
                    + '<strong>Import CBC &rarr; RI study</strong>. If there is no such button, '
                    + '<a href="/studies">install the VMACS importer</a> first.';
            }
        }, 9000);
    })();
</script>
{% endblock %}
