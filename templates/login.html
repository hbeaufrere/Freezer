<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Sign in &middot; CLIPR Repository</title>

    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <script src="/static/js/theme-init.js"></script>
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-mark" aria-hidden="true">&minus;80</div>
        <h1 class="login-title">CLIPR Repository</h1>
        <p class="login-sub">Raptor Biobank &middot; Freezer Management</p>

        {% if error %}
        <div class="alert alert-danger py-2 px-3 d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-circle"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label for="password" class="form-label">Lab password</label>
                <input type="password" class="form-control" id="password" name="password"
                       autocomplete="current-password" autofocus required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
            </button>
        </form>
    </main>
</body>
</html>
