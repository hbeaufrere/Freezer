<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CryoCube Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-snow2 text-primary" style="font-size: 2.5rem;"></i>
                <h4 class="mt-2 mb-0">CryoCube Manager</h4>
                <small class="text-muted">Biorepository Freezer Management</small>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2">
                <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label for="password" class="form-label">Lab Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Enter lab password" autofocus required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Log In
                </button>
            </form>
        </div>
    </div>
</body>
</html>
